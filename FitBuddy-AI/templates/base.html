<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>


<header class="nav">

    <a
        class="brand"
        href="/"
    >
        FIT<span>BUDDY</span>
    </a>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/view-all-users">
            Admin View
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="page">

    {% if error %}

    <div class="alert error">

        {{ error }}

    </div>

    {% endif %}


    {% if message %}

    <div class="alert success">

        {{ message }}

    </div>

    {% endif %}


    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        FitBuddy provides general wellness information
        and is not a substitute for medical advice.
    </p>

</footer>


</body>

</html>
